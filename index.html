<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tune Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Simple Tune Player</h1>
        </header>

        <main>
            <!-- Tune Selector -->
            <div class="tune-selector">
                <label for="tune-select">Select a tune:</label>
                <select id="tune-select">
                    <!-- Options populated by JavaScript -->
                </select>
            </div>

            <!-- Display Options -->
            <div class="display-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="position-mode-toggle">
                    <span class="checkbox-text">Show hand positions</span>
                </label>
                <div id="position-legend" class="position-legend hidden">
                    <div class="legend-section">
                        <span class="legend-title">Right Hand:</span>
                        <span class="legend-item" data-position="C" data-hand="right">
                            <span class="legend-color" style="background-color: #5dade2;"></span>
                            C
                        </span>
                        <span class="legend-item" data-position="G" data-hand="right">
                            <span class="legend-color" style="background-color: #ec7063;"></span>
                            G
                        </span>
                        <span class="legend-item" data-position="F" data-hand="right">
                            <span class="legend-color" style="background-color: #58d68d;"></span>
                            F
                        </span>
                        <span class="legend-item" data-position="D" data-hand="right">
                            <span class="legend-color" style="background-color: #bb8fce;"></span>
                            D
                        </span>
                    </div>
                    <div class="legend-section">
                        <span class="legend-title">Left Hand:</span>
                        <span class="legend-item" data-position="C" data-hand="left">
                            <span class="legend-color" style="background-color: #2874a6;"></span>
                            C
                        </span>
                        <span class="legend-item" data-position="G" data-hand="left">
                            <span class="legend-color" style="background-color: #b03a2e;"></span>
                            G
                        </span>
                        <span class="legend-item" data-position="F" data-hand="left">
                            <span class="legend-color" style="background-color: #1e8449;"></span>
                            F
                        </span>
                        <span class="legend-item" data-position="D" data-hand="left">
                            <span class="legend-color" style="background-color: #6c3483;"></span>
                            D
                        </span>
                    </div>
                    <div class="legend-hint">Hover over a note to see keyboard position</div>
                </div>
            </div>

            <!-- Score Display -->
            <div class="score-container">
                <canvas id="score-canvas"></canvas>
            </div>

            <!-- Live Keyboard Display -->
            <div class="live-keyboard-container">
                <canvas id="live-keyboard-canvas"></canvas>
            </div>

            <!-- Playback Controls -->
            <div class="controls">
                <button id="play-btn" class="control-btn" title="Play">
                    <span class="icon">▶</span>
                </button>
                <button id="pause-btn" class="control-btn" title="Pause" disabled>
                    <span class="icon">⏸</span>
                </button>
                <button id="stop-btn" class="control-btn" title="Stop" disabled>
                    <span class="icon">⏹</span>
                </button>
            </div>

            <!-- Tempo Control -->
            <div class="tempo-control">
                <label for="tempo-slider">Tempo: <span id="tempo-value">120</span> BPM</label>
                <input type="range" id="tempo-slider" min="40" max="200" value="120">
            </div>

            <!-- Progress Display -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <span id="time-display">0:00 / 0:00</span>
            </div>

            <!-- Tune Info -->
            <div id="tune-info" class="tune-info">
                <h3 id="tune-title"></h3>
                <p id="tune-composer"></p>
            </div>
        </main>

        <footer>
            <p>Use the Web Audio API to synthesize piano sounds</p>
        </footer>
    </div>

    <script src="tunes.js"></script>
    <script src="audio.js"></script>
    <script src="fingering.js"></script>
    <script src="score.js"></script>
    <script src="keyboard.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
</body>
</html>
